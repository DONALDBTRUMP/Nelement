name: Build Nelement APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 設定 Gradle 環境與快取
      uses: gradle/actions/setup-gradle@v4

    - name: 賦予 gradlew 執行權限
      run: chmod +x gradlew

    - name: 編譯 GPlay Debug APK
      run: ./gradlew assembleGplayDebug

    - name: 上傳 APK 產出物
      uses: actions/upload-artifact@v4
      with:
        name: Nelement-gplay-debug-apk
        path: app/build/outputs/apk/gplay/debug/*.apk
